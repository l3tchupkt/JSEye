name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine ruff pytest pytest-asyncio
          pip install -e .[dev]

      - name: Run Ruff linter
        run: |
          ruff check .

      - name: Run test suite
        run: |
          python -m pytest -v

      - name: Build wheel and source distributions
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          python -m twine check dist/*

      - name: Validate package contents and tag consistency
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/validate_release.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  pypi-publish:
    name: Publish to PyPI
    needs: [validate-and-build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/jseye
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish package to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

