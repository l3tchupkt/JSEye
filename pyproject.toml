[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jseye"
dynamic = ["version"]
description = "JavaScript Intelligence & Attack Surface Discovery Engine"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Lakshmikanthan K", email = "letchupkt.dev@gmail.com"}
]
maintainers = [
    {name = "Lakshmikanthan K", email = "letchupkt.dev@gmail.com"}
]
keywords = ["security", "javascript", "reconnaissance", "osint", "bug-bounty", "penetration-testing", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "jsbeautifier>=1.14.0",
    "jinja2>=3.1.0",
    "waybackpy>=3.0.6",
    "tldextract>=3.4.0",
    "rich>=12.0.2",
    "psutil>=5.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
headless = [
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.2",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "build>=0.10.0",
    "twine>=4.0.0",
]
all = [
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.urls]
Homepage = "https://github.com/letchupkt/jseye"
Repository = "https://github.com/letchupkt/jseye"
Documentation = "https://github.com/letchupkt/jseye/wiki"
"Bug Reports" = "https://github.com/letchupkt/jseye/issues"

[project.scripts]
jseye = "jseye.cli:cli_main"

[tool.setuptools]
packages = ["jseye", "jseye.core", "jseye.report", "jseye.plugins"]
include-package-data = true

[tool.setuptools.package-data]
jseye = ["data/*.json", "report/templates/*.html"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]